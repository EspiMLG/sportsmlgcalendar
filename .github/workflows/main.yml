name: Update Google Calendar

on:
  schedule:
    # Actualización automática diaria tras cada franja de partidos y anuncios de horarios (UTC)
    - cron: '30 12 * * *'  # Mediodía (anuncios de horarios LaLiga/ACB)
    - cron: '15 15 * * *'  # Fin de partidos matinales (12:00 / 12:30 / 14:00)
    - cron: '30 19 * * *'  # Fin de partidos de tarde (16:15 / 17:00 / 18:30)
    - cron: '15 21 * * *'  # Fin de partidos europeos/tarde-noche (19:30 / 20:00)
    - cron: '15 23 * * *'  # Fin de partidos nocturnos (20:30 / 21:00 / 21:30)
  workflow_dispatch:  # Permitir la ejecución manual

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permiso para hacer push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xvfb libxi6 tzdata
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb
        sudo apt-get -fy install
        rm google-chrome-stable_current_amd64.deb
        pip install -r requirements.txt

    - name: Run update script and integration tests
      env:
        DISPLAY: :99
      run: |
        sudo Xvfb :99 -ac &
        python malagacalendar.py
        PYTHONPATH=. pytest -v

    - name: Commit and push if calendar changed
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "github-actions-bot@users.noreply.github.com"
        git add *.ics index.html
        if git diff --cached --quiet; then
          echo "No hay cambios en los calendarios .ics ni en index.html, no se requiere commit."
        else
          git commit -m "Actualización automática de calendario 🤖"
          git push
        fi
